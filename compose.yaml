services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    volumes:
      - nokri_state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  nokri_state:
